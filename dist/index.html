<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>The Y Shop | Modern Menswear</title>
</head>
<body>
        <header class="shop">
        <p class="shop-announcement">Complimentary shipping on orders over $100</p>
        <h1>The Y Shop</h1>
        <div class="search-container">
            <label class="visually-hidden" for="site-search">Search the shop</label>
            <input id="site-search" type="search" placeholder="Search..." class="Search-input">
            <button class="search-button">Search</button>
        </div>
        <div class="list">
            <a href="wishlist.html" class="wishlistbag">Wish List</a>
            <a href="mybag.html" class="wishlistbag">My Bag</a>
        </div>
        <div class="Gender">
        <a href="index.html" aria-current="page">
        <button class="gender-active">Men</button></a>
        <a href="women.html">
        <button class="gender">Women</button></a>
        </div>
        <p class="modern-tagline">Modern fashion for everyday life</p>
        <div class="categories">
            <button class="category">New</button>
            <button class="category">Clothes</button> 
            <button class="category">Suits</button>
            <button class="category">Shoes</button>
            <button class="category">Hats</button>
            <button class="category">Bags</button>
            <button class="category">Accessories</button>
        </div>
        <div class="img-wrapper">
        <a href="dailywear.html">
            <img src="images/Dailywear.png" class="click-img" alt="Daily menswear collection"></a>
        <a href="thenightout.html">
            <img src="images/thenightout.png" class="click-img" alt="Evening looks collection"></a>
        <a href="beachday.html">
            <img src="images/beachday.png" class="click-img" alt="Beach day collection"></a>
        <a href="StreetStyle.html">

        <a href="SpecialFit.html">
            <img src="images/SpecialFit.png" class="click-img" alt="Special fit collection"></a>

</html>
